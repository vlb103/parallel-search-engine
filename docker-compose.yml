services:
  dataset:
    build:
      context: .
      target: dataset
    volumes:
      - dataset:/data

  server:
    build: .
    init: true
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      SERVER_THREADS: 16
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - dataset:/data:ro
    depends_on:
      dataset:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL"
        wait

volumes:
  ollama:
  dataset:
